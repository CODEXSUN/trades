name: trades

x-api-env: &api-env
  NODE_ENV: production
  AUTH_MODE: ${AUTH_MODE:-jwt}
  PLATFORM_API_PORT: ${PLATFORM_API_PORT:-7070}
  PLATFORM_WEB_PORT: ${PLATFORM_WEB_PORT:-7080}
  PLATFORM_API_URL: ${PLATFORM_API_URL:-http://trades-api:7070}
  PLATFORM_WEB_ORIGIN: ${PLATFORM_WEB_ORIGIN:?PLATFORM_WEB_ORIGIN is required}
  PLATFORM_WEB_ORIGINS: ${PLATFORM_WEB_ORIGINS:-}
  PLATFORM_WEB_HEALTH_URL: ${PLATFORM_WEB_HEALTH_URL:-http://trades-web:80}
  DB_DRIVER: mariadb
  DB_HOST: ${DB_HOST:-cxapp-mariadb}
  DB_PORT: 3306
  DB_USER: ${DB_USER:-cxapp_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  TRADES_DB_NAME: ${TRADES_DB_NAME:-trades_db}
  # Required by Core's public package schema; this is not a physical Trades database.
  DB_MASTER_NAME: __trades_core_guard_unused__
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  TRADES_DB_FRESH_ON_START: "0"
  TRADES_ALLOW_PRODUCTION_DB_RESET: "0"
  TRADES_BACKUP_DIR: /storage/backups/database
  TRADES_VERIFIED_BACKUP_ID: ${TRADES_VERIFIED_BACKUP_ID:-}
  TRADES_QUEUE_BACKEND: ${TRADES_QUEUE_BACKEND:-bullmq-redis}
  TRADES_REDIS_URL: ${TRADES_REDIS_URL:?TRADES_REDIS_URL is required}
  TRADES_QUEUE_WORKER_ENABLED: ${TRADES_QUEUE_WORKER_ENABLED:-1}
  TRADES_QUEUE_WORKER_INTERVAL_MS: ${TRADES_QUEUE_WORKER_INTERVAL_MS:-5000}
  TRADES_QUEUE_COMPLETED_RETENTION_DAYS: ${TRADES_QUEUE_COMPLETED_RETENTION_DAYS:-14}
  TRADES_QUEUE_FAILED_RETENTION_DAYS: ${TRADES_QUEUE_FAILED_RETENTION_DAYS:-30}
  TRADES_ALLOW_LIVE_RESTORE: "0"
  TRADES_LIVE_RESTORE_CONFIRM: ""
  TRADES_RESTORE_TEST_DB_NAME: ${TRADES_RESTORE_TEST_DB_NAME:-}
  STORAGE_ROOT: /storage/app
  STORAGE_PUBLIC_ROOT: /storage/public
  ENABLE_SINGLE_CLIENT: ${ENABLE_SINGLE_CLIENT:-1}
  CLIENT_CORPORATE_ID: ${CLIENT_CORPORATE_ID:-TRADES}
  CLIENT_DOMAIN: ${CLIENT_DOMAIN:-trades.codexsun.com}
  CLIENT_NAME: ${CLIENT_NAME:-Trades}
  CLIENT_SLUG: ${CLIENT_SLUG:-trades}
  CLIENT_ADMIN_NAME: ${CLIENT_ADMIN_NAME:-}
  CLIENT_ADMIN_EMAIL: ${CLIENT_ADMIN_EMAIL:-}
  CLIENT_ADMIN_PASSWORD: ${CLIENT_ADMIN_PASSWORD:-}
  CLIENT_DOMAIN_BASE: ${CLIENT_DOMAIN_BASE:-trades.in}
  SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
  SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
  SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
  SOFTWARE_ADMIN_NAME: ${SOFTWARE_ADMIN_NAME:-}
  SOFTWARE_ADMIN_EMAIL: ${SOFTWARE_ADMIN_EMAIL:-}
  SOFTWARE_ADMIN_PASSWORD: ${SOFTWARE_ADMIN_PASSWORD:-}

services:
  storage-init:
    image: ${TRADES_IMAGE_REGISTRY:-codexsun}/trades-api:${TRADES_API_IMAGE_TAG:-1.0.2}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "mkdir -p /storage/app /storage/public /storage/tenants /storage/backups/database && chown -R 1000:1000 /storage"
      ]
    volumes: ["trades-data:/storage"]
    networks: [backend]
    restart: "no"

  platform-migrate:
    build:
      context: ../..
      dockerfile: trades/.container/Dockerfile.api
      target: migrations
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TRADES_IMAGE_REGISTRY:-codexsun}/trades-migrations:${TRADES_MIGRATIONS_IMAGE_TAG:-1.0.2}
    profiles: [tools]
    environment:
      <<: *api-env
    volumes: ["trades-data:/storage"]
    networks: [backend]

  trades-api:
    build:
      context: ../..
      dockerfile: trades/.container/Dockerfile.api
      target: runtime
      args:
        TRADES_VERSION: ${TRADES_VERSION:-1.0.2}
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${TRADES_IMAGE_REGISTRY:-codexsun}/trades-api:${TRADES_API_IMAGE_TAG:-1.0.2}
    container_name: trades-api
    restart: unless-stopped
    depends_on:
      storage-init: { condition: service_completed_successfully }
    environment:
      <<: *api-env
    ports:
      - "${TRADES_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_API_HOST_PORT:-18070}:${PLATFORM_API_PORT:-7070}"
    volumes: ["trades-data:/storage"]
    networks: [backend]

  trades-web:
    build:
      context: ../..
      dockerfile: trades/.container/Dockerfile.web
      args:
        TRADES_VERSION: ${TRADES_VERSION:-1.0.2}
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
        CLIENT_NAME: ${CLIENT_NAME:-Trades}
    image: ${TRADES_IMAGE_REGISTRY:-codexsun}/trades-web:${TRADES_WEB_IMAGE_TAG:-1.0.2}
    container_name: trades-web
    restart: unless-stopped
    depends_on:
      trades-api: { condition: service_healthy }
    ports:
      - "${TRADES_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_WEB_HOST_PORT:-18080}:80"
    networks: [backend, edge]

volumes:
  trades-data:
    name: ${TRADES_DATA_VOLUME:-trades-platform-data}

networks:
  backend:
    name: ${CODEXSUN_BACKEND_NETWORK:-cxapp-network}
    external: true
  edge:
    name: ${CODEXSUN_EDGE_NETWORK:-cxapp-edge}
    external: true
